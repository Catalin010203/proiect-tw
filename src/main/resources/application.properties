spring.application.name=academic-events

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/academic_events}
spring.datasource.username=${DB_USERNAME:academic_user}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Security
# Utilizatorii sunt incarcati din baza de date (AppUserDetailsService), nu din acest fisier.
# Originile frontendului care pot apela API-ul cu cookie-uri (separate prin virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500}